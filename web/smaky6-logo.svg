<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="SMAKY6">
  <defs>
    <!-- Inline bevel: light gradient painted as a clip-shaped overlay -->
    <linearGradient id="bevel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EAE0C8" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#CFC6A4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6a5a40" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="logo-blur" x="-2%" y="-5%" width="108%" height="130%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Soft ground shadow (blurred, offset copy) -->
  <text x="213" y="78"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="80" font-weight="900" letter-spacing="3"
    text-anchor="middle"
    fill="#2A2520" opacity="0.30"
    filter="url(#logo-blur)">SMAKY6</text>

  <!-- Hard 3-D offset layer (bottom-right, simulates depth) -->
  <text x="213" y="76"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="80" font-weight="900" letter-spacing="3"
    text-anchor="middle"
    fill="#7a6a50">SMAKY6</text>

  <!-- Main layer: thick dark outline behind cream fill -->
  <text x="210" y="73"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="80" font-weight="900" letter-spacing="3"
    text-anchor="middle"
    fill="#CFC6A4"
    stroke="#2A2520" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"
    paint-order="stroke fill">SMAKY6</text>

  <!-- Top-edge highlight stroke (inner bevel feel) -->
  <text x="210" y="73"
    font-family="Impact,'Arial Black',Arial,sans-serif"
    font-size="80" font-weight="900" letter-spacing="3"
    text-anchor="middle"
    fill="none"
    stroke="#EEE6D0" stroke-width="2.5" stroke-linejoin="round"
    opacity="0.55">SMAKY6</text>
</svg>
